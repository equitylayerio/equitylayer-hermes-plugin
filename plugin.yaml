name: equitylayer
version: "0.2.0"
manifest_version: 2
api_version: 1
description: >
  Research CPO or space infrastructure with your own AI.
  EquityLayer's MCP maps your thesis to tracked variables with caveats and gaps; you
  write the four parts (hypothesis, why, tracking, wrong_if); the plugin keeps the
  harness and baseline on your machine and checks it on a schedule, reporting which
  links moved, what is late, and what needs a person. EquityLayer stores nothing. It
  never says what to buy, sell, size or time. Also lists published Research Packs.
author: EquityLayer
license: MIT
homepage: https://equitylayer.io
tags: [finance, research, equities, thesis, mcp, cpo, physical-ai, space]

provides_tools:
  - el_plan_thesis
  - el_get_variable
  - el_harness_save
  - el_harness_check
  - el_harness_seen
  - el_harness_list
  - el_list_registry
  - el_get_pack
  - el_scorecard
  - el_follow_create
  - el_follow_check
  - el_follow_list

requires_hermes: ">=0.23.0"

config_schema:
  mcp_url:
    type: str
    default: "https://equitylayer.io/mcp"
    label: "EquityLayer MCP URL"
    description: "https://equitylayer.io/mcp (default). http://localhost:<port>/mcp is accepted for development. Other hosts are refused."
