name: equitylayer
version: "0.1.0"
manifest_version: 2
api_version: 1
description: >
  EquityLayer research inside Hermes: list the Research Registry, open public
  research packs, scorecards, and thesis tests via https://equitylayer.io/mcp,
  and follow research with locally stored Follow Cards and scheduled checks.
  Demo mode uses free public research only. The plugin never pays.
author: EquityLayer
license: MIT
homepage: https://equitylayer.io
tags: [finance, research, equities, mcp, taiwan, ai-compute]

provides_tools:
  - el_list_registry
  - el_get_pack
  - el_scorecard
  - el_test_thesis
  - el_thesis_update
  - el_follow_create
  - el_follow_check
  - el_follow_list

requires_hermes: ">=0.21.6"

config_schema:
  mcp_url:
    type: str
    default: "https://equitylayer.io/mcp"
    label: "EquityLayer MCP URL"
    description: "https://equitylayer.io/mcp (default). https://equitylayer.io/mcp/full needs demo mode off. Other hosts are refused."
  demo_mode:
    type: bool
    default: true
    label: "Demo / free-only mode"
    description: "When on, only the public product route and public registry entries are used, and private thesis cards are not sent."
