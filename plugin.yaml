name: equitylayer
version: "0.4.0"
manifest_version: 2
api_version: 1
description: >
  Research CPO, custom AI chips or space infrastructure with your own AI. Type /equitylayer:start and Hermes
  guides you in four decisions: sector, how to follow it (curated readings or your own
  view), one card to approve, and how often to check. A local dashboard shows it all.
  EquityLayer's MCP maps your thesis to tracked variables with caveats and gaps; you
  write the four parts (hypothesis, why, tracking, wrong_if); the plugin keeps the
  harness and baseline on your machine and checks it on a schedule, reporting which
  links moved, what is late, and what needs a person. EquityLayer stores nothing. It
  never says what to buy, sell, size or time. Also lists published Research Packs.
author: EquityLayer
license: MIT
homepage: https://equitylayer.io
tags: [finance, research, equities, thesis, mcp, cpo, physical-ai, space]

provides_tools:
  - el_profile
  - el_plan
  - el_get_variable
  - el_track
  - el_check
  - el_seen
  - el_list
  - el_dashboard_render
  - el_research_pack

requires_hermes: ">=0.23.0"

config_schema:
  mcp_url:
    type: str
    default: "https://equitylayer.io/mcp"
    label: "EquityLayer MCP URL"
    description: "https://equitylayer.io/mcp (default). http://localhost:<port>/mcp is accepted for development. Other hosts are refused."
  recall_in_new_chats:
    type: bool
    default: true
    label: "Recall saved theses in new chats"
    description: "At the start of each new chat, list your saved harnesses (id, title, last check date and state) and your research profile (sectors, check time, language) in the system prompt, read from local files. Turn off to keep them out of prompts sent to your model provider."
